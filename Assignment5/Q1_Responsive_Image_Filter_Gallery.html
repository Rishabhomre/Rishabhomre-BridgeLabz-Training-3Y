<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="Q1_Responsive_Image_Filter_Gallery.css">
</head>
<body>
  <header class="page-header">
    <h1>Image Filter Gallery</h1>
    <p>Explore six CSS filters. Hover over an image to reveal its original look.</p>
  </header>
  <main>
    <section class="gallery" aria-label="Filtered image gallery">
      <figure class="photo"><img class="filter-blur" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&amp;fit=crop&amp;w=800&amp;q=80" alt="Mountain lake"><figcaption>Blur</figcaption></figure>
      <figure class="photo"><img class="filter-gray" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&amp;fit=crop&amp;w=800&amp;q=80" alt="Mountain landscape"><figcaption>Grayscale</figcaption></figure>
      <figure class="photo"><img class="filter-sepia" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&amp;fit=crop&amp;w=800&amp;q=80" alt="Forest trees"><figcaption>Sepia</figcaption></figure>
      <figure class="photo"><img class="filter-bright" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=800&amp;q=80" alt="Ocean beach"><figcaption>Brightness</figcaption></figure>
      <figure class="photo"><img class="filter-contrast" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&amp;fit=crop&amp;w=800&amp;q=80" alt="Rocky mountain peaks"><figcaption>Contrast</figcaption></figure>
      <figure class="photo"><img class="filter-hue" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&amp;fit=crop&amp;w=800&amp;q=80" alt="Sunrise over a field"><figcaption>Hue Rotate</figcaption></figure>
    </section>
  </main>
  <footer><p>Responsive CSS practice · Images require an internet connection.</p></footer>
</body>
</html>
