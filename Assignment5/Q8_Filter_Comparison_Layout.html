<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="Q8_Filter_Comparison_Layout.css">
</head>
<body>
  <header><h1>Filter Comparison</h1><p>Compare the original image with a filtered version. Hover over the right image to remove its filter.</p></header>
  <main class="comparison">
    <figure class="compare-card"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&amp;fit=crop&amp;w=1000&amp;q=80" alt="Original mountain lake image"><figcaption>Before · Original</figcaption></figure>
    <figure class="compare-card"><img class="filtered" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&amp;fit=crop&amp;w=1000&amp;q=80" alt="Mountain lake image with increased contrast"><figcaption>After · High Contrast</figcaption></figure>
  </main>
  <footer><p>Filters are visual effects applied directly through CSS.</p></footer>
</body>
</html>
