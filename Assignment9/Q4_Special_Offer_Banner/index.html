<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q4 – Special Offer Banner – Assignment 9</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 24px; background: #f4f6f9; color: #222; }
    main { max-width: 950px; margin: auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px #0001; }
    h1 { margin-top: 0; color: #183153; }
    button { cursor: pointer; padding: 9px 14px; margin: 5px 4px 5px 0; border: 0; border-radius: 6px; background: #2457a7; color: white; }
    input { padding: 9px; margin: 5px 0; border: 1px solid #bbb; border-radius: 5px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(170px,1fr)); gap: 12px; }
    .card, .item { padding: 14px; border: 1px solid #ddd; border-radius: 8px; margin: 8px 0; background: #fff; }
    .selected, .highlight { background: #fff2b3 !important; border: 2px solid #e0a800 !important; }
    .muted { color: #666; }
    .message { color: #16733a; font-weight: bold; }
    [hidden] { display: none !important; }
  </style>
  
</head>
<body>
<main>
  <header><h1>Q4 – Special Offer Banner</h1><p class="muted">Assignment 9 – jQuery Practical</p></header>

<section>
  <div id="banner1" class="item banner"><h2>Festival Sale – 30% OFF</h2><p>Limited-time savings on selected products.</p></div>
  <div id="banner2" class="item banner"><h2>Free Delivery</h2><p>Enjoy free delivery on orders above ₹999.</p></div>
  <div id="banner3" class="item banner"><h2>Student Special</h2><p>Extra savings for students this week.</p></div>
  <button id="hide">Hide First Banner</button><button id="show">Show All Banners</button>
  <button id="slideUp">Slide Up</button><button id="slideDown">Slide Down</button>
  <button id="fadeOut">Fade Out</button><button id="fadeIn">Fade In</button>
</section>

</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
</body>
</html>
