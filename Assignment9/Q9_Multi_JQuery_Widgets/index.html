<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q9 – Multi-jQuery Widgets – Assignment 9</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 24px; background: #f4f6f9; color: #222; }
    main { max-width: 950px; margin: auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px #0001; }
    h1 { margin-top: 0; color: #183153; }
    button { cursor: pointer; padding: 9px 14px; margin: 5px 4px 5px 0; border: 0; border-radius: 6px; background: #2457a7; color: white; }
    input { padding: 9px; margin: 5px 0; border: 1px solid #bbb; border-radius: 5px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(170px,1fr)); gap: 12px; }
    .card, .item { padding: 14px; border: 1px solid #ddd; border-radius: 8px; margin: 8px 0; background: #fff; }
    .selected, .highlight { background: #fff2b3 !important; border: 2px solid #e0a800 !important; }
    .muted { color: #666; }
    .message { color: #16733a; font-weight: bold; }
    [hidden] { display: none !important; }
  </style>
  
  <style>
    .tooltip { display:block; margin-top:8px; padding:6px; background:#183153; color:white; border-radius:5px; }
    #modal { border:2px solid #2457a7; padding:18px; margin-top:18px; }
  </style>

</head>
<body>
<main>
  <header><h1>Q9 – Multi-jQuery Widgets</h1><p class="muted">Assignment 9 – jQuery Practical</p></header>

<section>
  <h2>Carousel</h2>
  <div id="carousel" class="item"><p class="slide">Slide 1 – Welcome</p><p class="slide" hidden>Slide 2 – Latest Updates</p><p class="slide" hidden>Slide 3 – Explore Features</p></div>
  <h2>Dashboard Widgets</h2>
  <div class="grid" id="widgets">
    <article class="widget item" title="Shows your account summary">Account Summary</article>
    <article class="widget item" title="Shows recent activity">Recent Activity</article>
    <article class="widget item" title="Shows your saved reports">Saved Reports</article>
    <article class="widget item" title="Shows system notifications">Notifications</article>
    <article class="widget item" title="Shows your preferences">Settings</article>
  </div>
  <button id="notify">Show Notification</button>
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden class="item">
    <h3 id="modalTitle">Notification</h3><p>You have a new dashboard notification.</p><button id="closeModal">Close</button>
  </div>
</section>

</main>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="script.js"></script>
</body>
</html>
