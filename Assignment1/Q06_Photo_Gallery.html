<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="Q06_Photo_Gallery.css">
</head>
<body>
    <main class="gallery-page">
        <header><h1>Moments in Nature</h1><p>A small gallery of landscapes and outdoor scenes.</p></header>
        <section class="gallery" aria-label="Photo gallery">
            <figure class="photo"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Mountain lake surrounded by green hills"><figcaption>Mountain Lake</figcaption></figure>
            <figure class="photo"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="Sunlight filtering through a forest"><figcaption>Quiet Forest</figcaption></figure>
            <figure class="photo"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Wide landscape beneath an open sky"><figcaption>Open Landscape</figcaption></figure>
            <figure class="photo"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80" alt="Tall mountain peaks"><figcaption>Mountain Peaks</figcaption></figure>
            <figure class="photo"><img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=800&q=80" alt="Wild deer in a natural setting"><figcaption>Wildlife</figcaption></figure>
            <figure class="photo"><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80" alt="Lake and mountains at sunset"><figcaption>Evening View</figcaption></figure>
        </section>
    </main>
</body>
</html>
