<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="Q07_Contact_Form.css">
</head>
<body>
    <main class="contact-wrap">
        <form class="contact-form" action="#" method="get">
            <h1>Contact Us</h1>
            <p>Send a message and we will get back to you.</p>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Your full name" required>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required>
            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" placeholder="What is this about?" required>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message..." required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </main>
</body>
</html>
