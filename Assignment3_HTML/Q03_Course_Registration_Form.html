<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration</title>
</head>
<body>
    <header><h1>Course Registration Form</h1></header>
    <main>
        <!-- Fieldset and legend group related form controls. -->
        <form action="#" method="get">
            <fieldset>
                <legend>Student Details</legend>
                <p>
                    <label for="student-name">Full Name:</label>
                    <input type="text" id="student-name" name="studentName" required>
                </p>
                <p>
                    <label for="student-email">Email:</label>
                    <input type="email" id="student-email" name="studentEmail" required>
                </p>
                <p>
                    <label for="course">Select Course:</label>
                    <select id="course" name="course">
                        <option value="html">HTML Fundamentals</option>
                        <option value="javascript">JavaScript Basics</option>
                        <option value="git">Git and GitHub</option>
                    </select>
                </p>
                <p><button type="submit">Register</button></p>
            </fieldset>
        </form>

        <h2>Available Course Schedules</h2>
        <table border="1">
            <thead><tr><th>Day</th><th>Time</th><th>Instructor</th></tr></thead>
            <tbody>
                <tr><td>Monday</td><td>10:00 AM–11:00 AM</td><td>Ms. Sharma</td></tr>
                <tr><td>Wednesday</td><td>2:00 PM–3:00 PM</td><td>Mr. Verma</td></tr>
                <tr><td>Friday</td><td>11:00 AM–12:00 PM</td><td>Ms. Khan</td></tr>
            </tbody>
        </table>
    </main>
</body>
</html>
