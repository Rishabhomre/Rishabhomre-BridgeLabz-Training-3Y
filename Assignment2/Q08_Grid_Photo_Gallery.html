<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Photo Gallery</title>
    <link rel="stylesheet" href="Q08_Grid_Photo_Gallery.css">
</head>
<body>
    <main class="gallery-page">
        <header><h1>Travel Photo Gallery</h1><p>Scenes worth remembering.</p></header>
        <section class="gallery">
            <figure><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Mountain lake"><figcaption>Mountain Lake</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="Green forest"><figcaption>Forest Walk</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Open landscape"><figcaption>Open Landscape</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80" alt="Mountain peaks"><figcaption>High Peaks</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80" alt="Lake and mountains"><figcaption>Quiet Waters</figcaption></figure>
            <figure><img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=800&q=80" alt="Wildlife in nature"><figcaption>Wildlife</figcaption></figure>
        </section>
    </main>
</body>
</html>
