<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Card Flip</title>
    <link rel="stylesheet" href="Q09_Card_Flip.css">
</head>
<body>
    <main class="stage">
        <div class="flip-card" tabindex="0" aria-label="Hover or focus to flip the card">
            <div class="flip-inner">
                <section class="card-face card-front">
                    <img src="https://placehold.co/420x260/d7e9f5/20445e?text=Explore+Nature" alt="Nature-themed placeholder image">
                    <h1>Explore Nature</h1>
                    <p>Hover or focus on this card</p>
                </section>
                <section class="card-face card-back">
                    <h2>Discover More</h2>
                    <p>Spending time outdoors can help us slow down, notice details, and appreciate the natural world.</p>
                    <p>Take a walk, breathe deeply, and leave every place as clean as you found it.</p>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
