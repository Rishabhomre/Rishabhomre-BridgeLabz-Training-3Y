<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Hyperlink</title>
</head>
<body>
    <!-- target="_blank" opens the link in a new tab; rel improves security. -->
    <p>Visit <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">Google Search</a>.</p>
</body>
</html>
