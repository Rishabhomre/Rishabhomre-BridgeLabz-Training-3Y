<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Dashboard</title>
    <link rel="stylesheet" href="Q04_Grid_Dashboard.css">
</head>
<body>
    <div class="dashboard">
        <header class="topbar"><h1>Analytics Dashboard</h1><p>Overview</p></header>
        <aside class="sidebar">
            <h2>Navigation</h2>
            <nav><a href="#overview">Overview</a><a href="#reports">Reports</a><a href="#users">Users</a><a href="#settings">Settings</a></nav>
        </aside>
        <main class="main-content" id="overview">
            <article class="box wide"><h2>Performance Summary</h2><p>Website activity is stable and engagement is improving this month.</p></article>
            <article class="box" id="reports"><h2>Reports</h2><p>12 reports available.</p></article>
            <article class="box" id="users"><h2>Users</h2><p>1,240 active users.</p></article>
            <article class="box" id="settings"><h2>System Status</h2><p>All sample services operational.</p></article>
        </main>
    </div>
</body>
</html>
