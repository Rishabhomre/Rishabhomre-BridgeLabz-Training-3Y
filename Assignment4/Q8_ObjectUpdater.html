<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Object Updater</title>
    <link rel="stylesheet" href="Q8_ObjectUpdater.css">
</head>
<body>
    <main class="container">
        <h1>Update User Details</h1>
        <form id="userForm">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
            <label for="age">Age</label>
            <input id="age" name="age" type="number" min="1" max="120" required>
            <button type="submit">Update User</button>
        </form>
        <h2>Updated Object</h2>
        <pre id="userOutput" aria-live="polite"></pre>
    </main>
    <script src="Q8_ObjectUpdater.js"></script>
</body>
</html>
