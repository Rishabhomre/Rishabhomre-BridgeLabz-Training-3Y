<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The title appears in the browser tab and is used by bookmarks and search engines. -->
    <title>Important Head Elements</title>

    <!-- charset defines the character encoding used by the document. -->
    <meta charset="UTF-8">

    <!-- description gives search engines a short summary of the page. -->
    <meta name="description" content="A demonstration of important HTML head elements.">

    <!-- author identifies the person who created the page. -->
    <meta name="author" content="Student">

    <!-- base sets the base URL used to resolve relative URLs in the document. -->
    <base href="https://example.com/">

    <!-- link connects an external resource, here a favicon. -->
    <link rel="icon" href="favicon.ico">

    <!-- style is where CSS rules would go; it is intentionally empty for this HTML-only assignment. -->
    <style>
    </style>
</head>
<body>
    <h1>Important HTML Head Elements</h1>
    <p>This page demonstrates title, meta, base, link, and style elements in the head.</p>
</body>
</html>
