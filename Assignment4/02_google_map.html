<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map Embed</title>
</head>
<body>
    <h1>Map of Mathura</h1>
    <!-- loading="lazy" delays loading the map until it is near the visible part of the page, which can save resources. -->
    <iframe
        src="https://www.google.com/maps?q=Mathura%2C%20Uttar%20Pradesh&output=embed"
        title="Google Map showing Mathura"
        width="600"
        height="450"
        loading="lazy">
    </iframe>
</body>
</html>
