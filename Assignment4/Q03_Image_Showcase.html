<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase</title>
  <link rel="stylesheet" href="Q03_Image_Showcase.css">
</head>
<body>
  <header><h1>Moments in Nature</h1><p>A responsive six-image showcase with hover overlays.</p></header>
  <main class="gallery">
    <figure class="photo"><div class="image-wrap"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&amp;fit=crop&amp;w=900&amp;q=80" alt="Sunlit mountain landscape"><span class="overlay"></span></div><figcaption>Mountain Light</figcaption></figure>
    <figure class="photo"><div class="image-wrap"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&amp;fit=crop&amp;w=900&amp;q=80" alt="Lake surrounded by mountains"><span class="overlay"></span></div><figcaption>Quiet Lake</figcaption></figure>
    <figure class="photo"><div class="image-wrap"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&amp;fit=crop&amp;w=900&amp;q=80" alt="Sunlight in a green forest"><span class="overlay"></span></div><figcaption>Forest Path</figcaption></figure>
    <figure class="photo"><div class="image-wrap"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=900&amp;q=80" alt="Blue sea and sandy beach"><span class="overlay"></span></div><figcaption>Ocean Breeze</figcaption></figure>
    <figure class="photo"><div class="image-wrap"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&amp;fit=crop&amp;w=900&amp;q=80" alt="High rocky mountain peaks"><span class="overlay"></span></div><figcaption>Rocky Peaks</figcaption></figure>
    <figure class="photo"><div class="image-wrap"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&amp;fit=crop&amp;w=900&amp;q=80" alt="Golden sunrise over a field"><span class="overlay"></span></div><figcaption>Golden Morning</figcaption></figure>
  </main>
  <footer><p>Images load from Unsplash and require an internet connection.</p></footer>
</body>
</html>
