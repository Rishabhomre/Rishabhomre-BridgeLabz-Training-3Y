<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form and Iframe Result</title>
</head>
<body>
    <h1>Submit a Form</h1>
    <!-- The form targets the iframe below, so the result page loads inside it after submission. -->
    <form action="result.html" method="get" target="result-frame">
        <label for="user-text">Enter text:</label>
        <input type="text" id="user-text" name="user_text" required>
        <button type="submit">Submit</button>
    </form>
    <h2>Result</h2>
    <iframe name="result-frame" src="about:blank" title="Form submission result" width="500" height="150"></iframe>
</body>
</html>
