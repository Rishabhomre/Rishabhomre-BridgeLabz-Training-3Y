<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <link rel="stylesheet" href="Q5_MovieBooking.css">
</head>
<body>
    <main class="container">
        <h1>Movie Ticket Booking</h1>
        <form id="bookingForm" novalidate>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required>
            <small class="error" id="nameError"></small>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
            <small class="error" id="emailError"></small>

            <label for="seats">Number of seats (1–10)</label>
            <input id="seats" name="seats" type="number" min="1" max="10" step="1" required>
            <small class="error" id="seatsError"></small>

            <button type="submit">Book Tickets</button>
        </form>
        <section id="ticket" hidden aria-live="polite"></section>
    </main>
    <script src="Q5_MovieBooking.js"></script>
</body>
</html>
