<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tooltip Demonstration</title>
  <link rel="stylesheet" href="Q02_Tooltips.css">
</head>
<body>
  <header><h1>CSS Tooltips</h1><p>Hover or focus each item to reveal its hint.</p></header>
  <main class="tooltip-gallery">
    <span class="tip-wrap" tabindex="0">☁ Cloud<span class="tooltip">Cloud storage keeps files online.</span></span>
    <span class="tip-wrap" tabindex="0">✉ Email<span class="tooltip">Send messages to another person.</span></span>
    <span class="tip-wrap" tabindex="0">★ Favorite<span class="tooltip">Save this item for later.</span></span>
    <span class="tip-wrap" tabindex="0">ⓘ Info<span class="tooltip">Helpful details are shown here.</span></span>
  </main>
  <footer><p>Tooltips are made entirely with CSS—no JavaScript required.</p></footer>
</body>
</html>
