<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Video Embed</title>
</head>
<body>
    <h1>My YouTube Video</h1>
    <!-- The iframe embeds a YouTube video. Percentage dimensions adapt to the browser width. -->
    <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube video player"
        width="80%"
        height="45%"
        allowfullscreen>
    </iframe>
</body>
</html>
