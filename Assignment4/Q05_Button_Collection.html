<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Styled Button Collection</title>
  <link rel="stylesheet" href="Q05_Button_Collection.css">
</head>
<body>
  <header><h1>Button Collection</h1><p>Hover, press, tab to focus, and inspect the disabled state.</p></header>
  <main>
    <section class="button-panel" aria-label="Button style examples">
      <button class="btn primary" type="button">Primary</button>
      <button class="btn secondary" type="button">Secondary</button>
      <button class="btn outline" type="button">Outline</button>
      <button class="btn disabled" type="button" disabled>Disabled</button>
    </section>
    <p class="hint">The disabled button cannot be activated. Use Tab to see the focus outline on enabled buttons.</p>
  </main>
  <footer><p>Buttons should be clear, consistent, and keyboard accessible.</p></footer>
</body>
</html>
