<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URI Encoding Demo</title>
</head>
<body>
    <h1>URI Encoding</h1>
    <p>The space between HTML and CSS is encoded as %20 in the URL.</p>
    <p>Encoded link:</p>
    <a href="https://example.com/search?query=HTML%20%26%20CSS">Search for HTML &amp; CSS</a>
</body>
</html>
