<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini User Interface Layout</title>
  <link rel="stylesheet" href="Q10_Mini_UI_Layout.css">
</head>
<body>
  <header class="topbar"><a href="#home" class="brand">Bloom</a><span>Simple ideas, better days.</span></header>
  <main id="home">
    <section class="main-card">
      <div class="card-intro">
        <div><p class="eyebrow">YOUR NEXT CHAPTER</p><h1>Make something meaningful.</h1><p>Sign up to receive a short weekly note with ideas, inspiration, and useful resources.</p></div>
        <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&amp;fit=crop&amp;w=500&amp;q=80" alt="Soft pink flowers in bloom">
      </div>
      <form action="#" method="get">
        <label for="full-name">Full name</label>
        <input id="full-name" name="full-name" type="text" placeholder="Your name" required>
        <label for="email-address">Email address</label>
        <input id="email-address" name="email-address" type="email" placeholder="you@example.com" required>
        <div class="form-actions"><button type="submit" class="primary">Join the list</button><button type="reset" class="secondary">Clear form</button></div>
      </form>
    </section>
  </main>
  <footer><p>© 2026 Bloom Studio · Made with care</p></footer>
</body>
</html>
