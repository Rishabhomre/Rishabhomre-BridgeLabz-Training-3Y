<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borders and Padding Demonstration</title>
  <link rel="stylesheet" href="Q01_Borders_Padding.css">
</head>
<body>
  <header class="page-header">
    <h1>Borders &amp; Padding</h1>
    <p>Explore border styles, rounded corners, and internal spacing.</p>
  </header>
  <main>
    <section class="box-gallery" aria-label="Border examples">
      <article class="demo-box solid"><h2>Solid</h2><p>12px padding</p></article>
      <article class="demo-box dashed"><h2>Dashed</h2><p>20px padding</p></article>
      <article class="demo-box double"><h2>Double</h2><p>28px padding</p></article>
      <article class="demo-box groove"><h2>Groove</h2><p>16px padding</p></article>
      <article class="demo-box rounded"><h2>Rounded</h2><p>Border radius</p></article>
    </section>
  </main>
  <footer><p>CSS box styling practice</p></footer>

</html>
