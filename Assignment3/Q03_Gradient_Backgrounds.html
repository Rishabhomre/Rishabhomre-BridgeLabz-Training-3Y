<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="Q03_Gradient_Backgrounds.css">

<body>
  <header class="fixed-header"><a href="#linear">Gradient Studio</a><span>CSS Backgrounds</span></header>
  <main>
    <section id="linear" class="gradient-section linear">
      <div class="gradient-copy"><h1>Linear Gradient</h1><p>A linear gradient blends colors along a straight line, from one direction to another.</p></div>
