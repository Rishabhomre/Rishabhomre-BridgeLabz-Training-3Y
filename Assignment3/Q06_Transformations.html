<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transformations</title>
  <link rel="stylesheet" href="Q06_Transformations.css">
</head>
<body>
  <header><h1>CSS Transformations</h1><p>Hover over each tile to activate its transformation.</p></header>
  <main class="transform-gallery">
    <figure><div class="transform-box rotate">A</div><figcaption><strong>rotate()</strong><br>Turns the box</figcaption></figure>
    <figure><div class="transform-box scale">B</div><figcaption><strong>scale()</strong><br>Changes its size</figcaption></figure>
    <figure><div class="transform-box translate">C</div><figcaption><strong>translate()</strong><br>Moves its position</figcaption></figure>
    <figure><div class="transform-box skew">D</div><figcaption><strong>skew()</strong><br>Slants the box</figcaption></figure>
  </main>
  <footer><p>All transformations use a 0.4-second ease transition.</p></footer>
</body>
</html>
