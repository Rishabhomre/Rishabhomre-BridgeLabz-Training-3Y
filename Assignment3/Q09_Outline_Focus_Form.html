<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outline and Focus Form</title>
  <link rel="stylesheet" href="Q09_Outline_Focus_Form.css">
</head>
<body>
  <header><h1>Outline &amp; Focus Styling</h1><p>Use the keyboard or click each field to see focus outlines.</p></header>
  <main>
    <form class="contact-form" action="#" method="get">
      <label for="name">Your name</label>
      <input id="name" name="name" type="text" placeholder="Enter your name">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" placeholder="Write a short message"></textarea>
      <button type="submit">Submit</button>
    </form>
    <section class="outline-samples">
      <h2>Outline styles</h2>
      <p class="outline-dotted">Dotted outline</p>
      <p class="outline-dashed">Dashed outline</p>
      <p class="outline-double">Double outline with offset</p>
    </section>
  </main>
  <footer><p>Visible focus styles help everyone navigate forms.</p></footer>
</body>
</html>
